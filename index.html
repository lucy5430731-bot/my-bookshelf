<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的個人讀書紀錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 圖表庫 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .tag-btn.active {
      background-color: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }
    .tab-btn.active {
      border-bottom: 3px solid #4f46e5;
      color: #4f46e5;
      font-weight: bold;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans text-slate-800">
  <div class="max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-xl">
    
    <!-- 頂部標題與 Tab 切換列 -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-slate-200 gap-4">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-800 flex items-center gap-2">
        <span>📚</span> 我的個人讀書紀錄
      </h1>
      <div class="flex gap-4 border-b md:border-b-0 w-full md:w-auto justify-center">
        <button onclick="switchTab('shelf')" id="tab-shelf" class="tab-btn active pb-2 px-3 text-sm md:text-base">📚 我的書櫃</button>
        <button onclick="switchTab('add')" id="tab-add" class="tab-btn pb-2 px-3 text-sm md:text-base">➕ 新增書籍</button>
        <button onclick="switchTab('analytics')" id="tab-analytics" class="tab-btn pb-2 px-3 text-sm md:text-base">📊 閱讀分析</button>
      </div>
    </div>

    <!-- ================= TAB 1: 我的書櫃 (首頁) ================= -->
    <div id="view-shelf" class="space-y-6">
      <!-- 搜尋與篩選控制列 -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-1 md:grid-cols-4 gap-3">
        <input type="text" id="searchInput" oninput="filterBooks()" placeholder="🔍 搜尋書名、作者、心得..." class="p-2 border rounded-lg text-sm md:col-span-1">
        
        <select id="filterStatus" onchange="filterBooks()" class="p-2 border rounded-lg text-sm bg-white">
          <option value="全部">所有閱讀狀態</option>
          <option value="已完讀">已完讀</option>
          <option value="閱讀中">閱讀中</option>
          <option value="想讀">想讀</option>
          <option value="棄書">棄書</option>
        </select>

        <select id="filterCategory" onchange="filterBooks()" class="p-2 border rounded-lg text-sm bg-white">
          <option value="全部">所有書籍分類</option>
        </select>

        <select id="sortBy" onchange="filterBooks()" class="p-2 border rounded-lg text-sm bg-white">
          <option value="finishDateDesc">完讀日期 (最新到最舊)</option>
          <option value="ratingDesc">星等評分 (高到低)</option>
        </select>
      </div>

      <!-- 書籍卡片牆 -->
      <div id="bookGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <!-- 書本卡片將由 JS 動態生成 -->
      </div>
    </div>

    <!-- ================= TAB 2: 新增書籍表單 ================= -->
    <div id="view-add" class="hidden space-y-6">
      <!-- API Key 設定 -->
      <div class="p-4 bg-amber-50 border border-amber-200 rounded-xl">
        <label class="block text-sm font-semibold text-amber-900 mb-1">Google AI Studio API Key：</label>
        <input type="password" id="apiKey" placeholder="貼上你的 API Key (AIzaSy...)" class="w-full p-2 border border-amber-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>

      <!-- 搜尋與帶入 -->
      <div class="flex gap-2">
        <input type="text" id="bookSearchInput" placeholder="輸入中文書名或 ISBN 碼 (例如 原子習慣)..." class="flex-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        <button onclick="fetchBookInfo()" id="searchBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-3 rounded-xl transition">
          <span>⚡ 自動帶入資料</span>
        </button>
      </div>

      <!-- 表單內容 -->
      <div class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="flex flex-col items-center">
            <div class="w-36 h-48 bg-slate-200 rounded-lg overflow-hidden flex items-center justify-center text-slate-400 border border-slate-300 mb-3 relative">
              <img id="coverPreview" src="" class="w-full h-full object-cover hidden">
              <span id="noCoverText" class="text-xs text-center p-2">暫無封面</span>
            </div>
            
            <div class="w-full space-y-2">
              <label class="block w-full text-center bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs py-2 px-3 rounded-lg border border-slate-300 cursor-pointer font-medium transition">
                📷 選擇上傳圖片
                <input type="file" id="coverFileInput" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
              </label>
              <input type="text" id="coverUrl" placeholder="或貼上圖片網址..." class="w-full text-xs p-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
          </div>

          <div class="md:col-span-2 space-y-3">
            <div>
              <label class="block text-xs text-slate-500 font-medium">中文書名 *</label>
              <input type="text" id="titleZh" class="w-full p-2 border border-slate-300 rounded-lg text-sm font-bold">
            </div>
            <div>
              <label class="block text-xs text-slate-500 font-medium">原文書名 / 副標題</label>
              <input type="text" id="titleOrig" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 font-medium">作者</label>
                <input type="text" id="authors" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
              </div>
              <div>
                <label class="block text-xs text-slate-500 font-medium">出版社</label>
                <input type="text" id="publisher" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 font-medium">出版日期</label>
                <input type="text" id="pubDate" placeholder="YYYY-MM-DD" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
              </div>
              <div>
                <label class="block text-xs text-slate-500 font-medium">博客來連結</label>
                <a id="booksLink" href="#" target="_blank" class="text-xs text-indigo-600 underline block mt-2 truncate">尚未產生</a>
              </div>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-500 font-medium mb-2">書籍分類（可多選）</label>
          <div id="categoryContainer" class="flex flex-wrap gap-2 mb-2"></div>
          <div class="flex gap-2">
            <input type="text" id="customTagInput" placeholder="新增自訂標籤..." class="text-xs p-2 border rounded-lg flex-1">
            <button onclick="addCustomTag()" type="button" class="text-xs bg-slate-200 text-slate-700 px-3 py-1 rounded-lg font-medium">新增標籤</button>
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-500 font-medium mb-1">書籍簡介</label>
          <textarea id="summary" rows="3" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-slate-50"></textarea>
        </div>

        <hr class="border-slate-200 my-4">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">閱讀狀態</label>
            <select id="status" class="w-full p-2 border rounded-lg text-sm bg-white">
              <option value="已完讀">已完讀</option>
              <option value="閱讀中">閱讀中</option>
              <option value="想讀">想讀</option>
              <option value="棄書">棄書</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">完讀日期</label>
            <input type="date" id="finishDate" class="w-full p-2 border rounded-lg text-sm bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">星等評分 (0–5)</label>
            <select id="rating" class="w-full p-2 border rounded-lg text-sm bg-white">
              <option value="5.0">⭐⭐⭐⭐⭐ (5.0)</option>
              <option value="4.5">⭐⭐⭐⭐✨ (4.5)</option>
              <option value="4.0">⭐⭐⭐⭐ (4.0)</option>
              <option value="3.5">⭐⭐⭐✨ (3.5)</option>
              <option value="3.0">⭐⭐⭐ (3.0)</option>
              <option value="2.5">⭐⭐✨ (2.5)</option>
              <option value="2.0">⭐⭐ (2.0)</option>
              <option value="1.0">⭐ (1.0)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">喜歡的金句 / 佳句摘錄</label>
          <textarea id="quotes" rows="2" placeholder="輸入喜歡的句子..." class="w-full p-2 border border-slate-300 rounded-lg text-sm"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">閱讀心得 / 隨筆</label>
          <textarea id="notes" rows="3" placeholder="記錄這本書帶給你的想法..." class="w-full p-2 border border-slate-300 rounded-lg text-sm"></textarea>
        </div>

        <button onclick="saveRecord()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg">
          💾 儲存讀書紀錄至書櫃
        </button>
      </div>
    </div>

    <!-- ================= TAB 3: 閱讀分析數據 ================= -->
    <div id="view-analytics" class="hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-indigo-50 p-4 rounded-xl text-center border border-indigo-100">
          <p class="text-xs text-indigo-600 font-bold">2026 完讀總本數</p>
          <p id="stat-total-2026" class="text-3xl font-extrabold text-indigo-900 mt-1">0 本</p>
        </div>
        <div class="bg-amber-50 p-4 rounded-xl text-center border border-amber-100">
          <p class="text-xs text-amber-600 font-bold">平均給分</p>
          <p id="stat-avg-rating" class="text-3xl font-extrabold text-amber-900 mt-1">0.0 ⭐</p>
        </div>
        <div class="bg-emerald-50 p-4 rounded-xl text-center border border-emerald-100">
          <p class="text-xs text-emerald-600 font-bold">最喜歡的類型</p>
          <p id="stat-top-category" class="text-3xl font-extrabold text-emerald-900 mt-1">-</p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <h3 class="text-sm font-bold text-slate-700 mb-4 text-center">📈 2026 每月完讀數量分布</h3>
          <canvas id="monthlyChart"></canvas>
        </div>
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <h3 class="text-sm font-bold text-slate-700 mb-4 text-center">🍕 閱讀書籍類型占比</h3>
          <canvas id="categoryChart"></canvas>
        </div>
      </div>
    </div>

  </div>

  <!-- 單本書籍詳細資料 Modal (彈窗) -->
  <div id="bookModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
      
      <div class="flex gap-4">
        <img id="modalCover" src="" class="w-24 h-32 object-cover rounded-lg border">
        <div>
          <h2 id="modalTitleZh" class="text-lg font-bold text-slate-800"></h2>
          <p id="modalTitleOrig" class="text-xs text-slate-500 mb-2"></p>
          <p class="text-xs text-slate-600">作者：<span id="modalAuthors"></span></p>
          <p class="text-xs text-slate-600">出版社：<span id="modalPublisher"></span></p>
          <p class="text-xs text-slate-600">完讀日期：<span id="modalFinishDate"></span></p>
          <div id="modalRating" class="mt-2 text-amber-500 font-bold text-sm"></div>
        </div>
      </div>

      <div id="modalCategories" class="flex flex-wrap gap-1"></div>

      <div class="bg-slate-50 p-3 rounded-lg text-xs space-y-1">
        <p class="font-bold text-slate-700">【書籍簡介】</p>
        <p id="modalSummary" class="text-slate-600 leading-relaxed"></p>
      </div>

      <div class="bg-amber-50/60 p-3 rounded-lg text-xs border border-amber-200/60 space-y-1">
        <p class="font-bold text-amber-900">💬 金句摘錄：</p>
        <p id="modalQuotes" class="text-amber-800 italic"></p>
      </div>

      <div class="bg-indigo-50/60 p-3 rounded-lg text-xs border border-indigo-200/60 space-y-1">
        <p class="font-bold text-indigo-900">📝 閱讀心得與筆記：</p>
        <p id="modalNotes" class="text-indigo-800 leading-relaxed"></p>
      </div>

      <a id="modalBooksLink" href="#" target="_blank" class="block text-center text-xs text-indigo-600 underline">前往博客來商品頁</a>

      <button onclick="deleteBook()" class="w-full bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100 text-xs py-2 rounded-lg font-medium transition">
        🗑️ 刪除此書籍紀錄
      </button>
    </div>
  </div>

  <script>
    // 資料結構初始化
    let books = JSON.parse(localStorage.getItem('my_bookshelf') || '[]');
    let currentModalBookId = null;

    const defaultCategories = [
      '商業思維', '市場行銷', '投資理財', '職場工作術', '領導管理',
      '心理學', '個人成長/習慣', '人際溝通', '情緒整理', '哲學思考',
      '人文歷史', '社會科學', '深度文化', '翻譯小說', '繁體小說',
      '傳記/自傳', '人工智慧/科技', '科普', '旅遊/冒險', '藝術/設計'
    ];
    let selectedCategories = new Set();

    // Tab 切換
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');

      document.getElementById('view-shelf').classList.add('hidden');
      document.getElementById('view-add').classList.add('hidden');
      document.getElementById('view-analytics').classList.add('hidden');

      document.getElementById(`view-${tabName}`).classList.remove('hidden');

      if (tabName === 'shelf') renderShelf();
      if (tabName === 'analytics') renderAnalytics();
    }

    // 書櫃卡片渲染與篩選
    function renderShelf() {
      // 動態更新分類篩選下拉選單
      const filterCatSelect = document.getElementById('filterCategory');
      const allCategories = new Set(defaultCategories);
      books.forEach(b => (b.categories || []).forEach(c => allCategories.add(c)));
      
      filterCatSelect.innerHTML = '<option value="全部">所有書籍分類</option>';
      allCategories.forEach(cat => {
        filterCatSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
      });

      filterBooks();
    }

    function filterBooks() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('filterStatus').value;
      const category = document.getElementById('filterCategory').value;
      const sortBy = document.getElementById('sortBy').value;

      let filtered = books.filter(b => {
        const matchesSearch = (b.titleZh || '').toLowerCase().includes(search) ||
                              (b.authors || '').toLowerCase().includes(search) ||
                              (b.notes || '').toLowerCase().includes(search) ||
                              (b.quotes || '').toLowerCase().includes(search);
        
        const matchesStatus = status === '全部' || b.status === status;
        const matchesCat = category === '全部' || (b.categories || []).includes(category);

        return matchesSearch && matchesStatus && matchesCat;
      });

      // 排序
      filtered.sort((a, b) => {
        if (sortBy === 'finishDateDesc') return new Date(b.finishDate || 0) - new Date(a.finishDate || 0);
        if (sortBy === 'ratingDesc') return parseFloat(b.rating || 0) - parseFloat(a.rating || 0);
      });

      const grid = document.getElementById('bookGrid');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">尚無書籍資料，點擊頂部「➕ 新增書籍」開始記錄吧！</div>`;
        return;
      }

      filtered.forEach(book => {
        const card = document.createElement('div');
        card.className = "bg-white border rounded-xl overflow-hidden shadow-sm hover:shadow-md transition cursor-pointer flex flex-col";
        card.onclick = () => openModal(book.id);

        const coverSrc = book.coverUrl || 'https://via.placeholder.com/150x200?text=No+Cover';
        const stars = '⭐'.repeat(Math.floor(parseFloat(book.rating || 0)));

        card.innerHTML = `
          <div class="h-44 bg-slate-100 overflow-hidden relative">
            <img src="${coverSrc}" class="w-full h-full object-cover">
            <span class="absolute top-2 right-2 text-[10px] bg-slate-800/80 text-white px-2 py-0.5 rounded-full">${book.status || '已完讀'}</span>
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between space-y-1">
            <div>
              <h3 class="font-bold text-xs line-clamp-1 text-slate-800">${book.titleZh}</h3>
              <p class="text-[10px] text-slate-500 line-clamp-1">${book.authors || '未知作者'}</p>
            </div>
            <div class="pt-2 border-t flex justify-between items-center text-[10px] text-slate-400">
              <span>${stars || '無評分'}</span>
              <span>${book.finishDate || ''}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Modal 彈窗控制
    function openModal(id) {
      const book = books.find(b => b.id === id);
      if (!book) return;

      currentModalBookId = id;
      document.getElementById('modalCover').src = book.coverUrl || 'https://via.placeholder.com/150x200?text=No+Cover';
      document.getElementById('modalTitleZh').innerText = book.titleZh;
      document.getElementById('modalTitleOrig').innerText = book.titleOrig || '';
      document.getElementById('modalAuthors').innerText = book.authors || '無';
      document.getElementById('modalPublisher').innerText = book.publisher || '無';
      document.getElementById('modalFinishDate').innerText = book.finishDate || '未紀錄';
      document.getElementById('modalRating').innerText = `⭐ ${book.rating} / 5.0`;
      document.getElementById('modalSummary').innerText = book.summary || '無簡介';
      document.getElementById('modalQuotes').innerText = book.quotes || '尚無紀錄金句';
      document.getElementById('modalNotes').innerText = book.notes || '尚無紀錄心得';
      
      const linkEl = document.getElementById('modalBooksLink');
      linkEl.href = book.booksLink || '#';

      const catEl = document.getElementById('modalCategories');
      catEl.innerHTML = '';
      (book.categories || []).forEach(c => {
        catEl.innerHTML += `<span class="bg-indigo-50 text-indigo-600 text-[10px] px-2 py-0.5 rounded-md font-medium">${c}</span>`;
      });

      document.getElementById('bookModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('bookModal').classList.add('hidden');
    }

    function deleteBook() {
      if (confirm('確定要刪除這本書的紀錄嗎？')) {
        books = books.filter(b => b.id !== currentModalBookId);
        localStorage.setItem('my_bookshelf', JSON.stringify(books));
        closeModal();
        renderShelf();
      }
    }

    // 儲存新書籍
    function saveRecord() {
      const titleZh = document.getElementById('titleZh').value.trim();
      if (!titleZh) return alert('請填寫中文書名！');

      const newBook = {
        id: Date.now().toString(),
        titleZh: titleZh,
        titleOrig: document.getElementById('titleOrig').value,
        authors: document.getElementById('authors').value,
        publisher: document.getElementById('publisher').value,
        pubDate: document.getElementById('pubDate').value,
        summary: document.getElementById('summary').value,
        coverUrl: document.getElementById('coverUrl').value,
        booksLink: document.getElementById('booksLink').href,
        categories: Array.from(selectedCategories),
        status: document.getElementById('status').value,
        finishDate: document.getElementById('finishDate').value,
        rating: document.getElementById('rating').value,
        quotes: document.getElementById('quotes').value,
        notes: document.getElementById('notes').value
      };

      books.unshift(newBook);
      localStorage.setItem('my_bookshelf', JSON.stringify(books));

      alert('🎉 成功儲存紀錄！');
      switchTab('shelf');
    }

    // 分類標籤渲染
    function renderCategories() {
      const container = document.getElementById('categoryContainer');
      container.innerHTML = '';
      defaultCategories.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `tag-btn text-xs px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600 font-medium ${selectedCategories.has(cat) ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => {
          if (selectedCategories.has(cat)) selectedCategories.delete(cat);
          else selectedCategories.add(cat);
          renderCategories();
        };
        container.appendChild(btn);
      });
    }

    function addCustomTag() {
      const input = document.getElementById('customTagInput');
      const val = input.value.trim();
      if (val && !defaultCategories.includes(val)) {
        defaultCategories.push(val);
        selectedCategories.add(val);
        renderCategories();
        input.value = '';
      }
    }

    // 閱讀分析圖表渲染 (Chart.js)
    let monthlyChartInstance = null;
    let categoryChartInstance = null;

    function renderAnalytics() {
      const year2026Books = books.filter(b => (b.finishDate || '').startsWith('2026') && b.status === '已完讀');
      
      document.getElementById('stat-total-2026').innerText = `${year2026Books.length} 本`;

      // 平均給分
      if (books.length > 0) {
        const avg = (books.reduce((acc, b) => acc + parseFloat(b.rating || 0), 0) / books.length).toFixed(1);
        document.getElementById('stat-avg-rating').innerText = `${avg} ⭐`;
      }

      // 每月分布資料 (2026)
      const monthCounts = Array(12).fill(0);
      year2026Books.forEach(b => {
        const m = parseInt(b.finishDate.split('-')[1]) - 1;
        if (m >= 0 && m < 12) monthCounts[m]++;
      });

      // 類型分布資料
      const catMap = {};
      books.forEach(b => {
        (b.categories || []).forEach(c => {
          catMap[c] = (catMap[c] || 0) + 1;
        });
      });

      const topCat = Object.entries(catMap).sort((a,b) => b[1] - a[1])[0];
      document.getElementById('stat-top-category').innerText = topCat ? topCat[0] : '-';

      // 繪製月份圖表
      if (monthlyChartInstance) monthlyChartInstance.destroy();
      const ctx1 = document.getElementById('monthlyChart').getContext('2d');
      monthlyChartInstance = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
          datasets: [{
            label: '完讀本數',
            data: monthCounts,
            backgroundColor: '#6366f1',
            borderRadius: 6
          }]
        },
        options: { responsive: true, plugins: { legend: { display: false } } }
      });

      // 繪製圓餅圖
      if (categoryChartInstance) categoryChartInstance.destroy();
      const ctx2 = document.getElementById('categoryChart').getContext('2d');
      categoryChartInstance = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: Object.keys(catMap),
          datasets: [{
            data: Object.values(catMap),
            backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#3b82f6']
          }]
        },
        options: { responsive: true }
      });
    }

    // 初始化自動帶入與封面上傳
    renderCategories();
    document.getElementById('finishDate').valueAsDate = new Date();
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) document.getElementById('apiKey').value = savedKey;

    document.getElementById('apiKey').addEventListener('change', (e) => {
      localStorage.setItem('gemini_api_key', e.target.value.trim());
    });

    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function fetchBookInfo() {
      const query = document.getElementById('bookSearchInput').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!query) return alert('請輸入中文書名或 ISBN！');

      const btn = document.getElementById('searchBtn');
      btn.innerText = '⚡ 正在檢索圖書庫...';
      btn.disabled = true;

      const cleanQuery = query.replace(/[- ]/g, '');

      try {
        const searchTerms = [`isbn:${cleanQuery}`, `intitle:${query}`, query];
        let gbItem = null;

        for (const term of searchTerms) {
          try {
            let res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(term)}&maxResults=1`);
            let data = await res.json();
            if (data.items && data.items.length > 0) {
              gbItem = data.items[0];
              break;
            }
          } catch(e){}
        }

        if (gbItem) {
          const info = gbItem.volumeInfo;
          document.getElementById('titleZh').value = info.title || '';
          document.getElementById('titleOrig').value = info.subtitle || '';
          document.getElementById('authors').value = (info.authors || []).join(', ');
          document.getElementById('publisher').value = info.publisher || '';
          document.getElementById('pubDate').value = info.publishedDate || '';
          document.getElementById('summary').value = info.description || '（無簡介，可手動填寫）';

          if (info.categories) {
            info.categories.forEach(c => {
              defaultCategories.forEach(dc => {
                if (c.includes(dc) || dc.includes(c)) selectedCategories.add(dc);
              });
            });
            renderCategories();
          }

          const searchKey = encodeURIComponent(query);
          const linkEl = document.getElementById('booksLink');
          linkEl.href = `https://search.books.com.tw/search/query/key/${searchKey}/cat/all`;
          linkEl.innerText = '點此前往博客來搜尋頁面';

          if (info.imageLinks && info.imageLinks.thumbnail) {
            const httpsCover = info.imageLinks.thumbnail.replace('http://', 'https://');
            document.getElementById('coverUrl').value = httpsCover;
            updateCoverPreview(httpsCover);
          }

          btn.innerText = '⚡ 自動帶入資料';
          btn.disabled = false;
          return;
        }

        if (apiKey) {
          btn.innerText = '🔍 圖書館未找到，AI 檢索中...';
          await fetchFromGeminiWithRetry(query, apiKey);
        } else {
          alert('圖書館資料庫中暫無此書籍，可手動填寫或輸入 API Key 開啟 AI 檢索。');
        }

      } catch (err) {
        if (apiKey) await fetchFromGeminiWithRetry(query, apiKey);
      } finally {
        btn.innerText = '⚡ 自動帶入資料';
        btn.disabled = false;
      }
    }

    async function fetchFromGeminiWithRetry(query, apiKey) {
      const btn = document.getElementById('searchBtn');
      const systemPrompt = "你是一個圖書整理員。當收到書名或ISBN，請搜尋資料並以 strict JSON 格式回傳資訊。books_link 請輸出博客來最新搜尋格式：https://search.books.com.tw/search/query/key/【ISBN或關鍵字】/cat/all";
      const jsonSchema = {
        type: "OBJECT",
        properties: {
          book_title_zh: { type: "STRING" },
          book_title_original: { type: "STRING" },
          authors: { type: "ARRAY", items: { type: "STRING" } },
          publisher: { type: "STRING" },
          publication_date: { type: "STRING" },
          categories: { type: "ARRAY", items: { type: "STRING" } },
          summary: { type: "STRING" },
          books_link: { type: "STRING" }
        },
        required: ["book_title_zh", "authors", "publisher", "summary", "books_link"]
      };

      const modelName = 'gemini-3.8-flash';

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `請檢索這本書的完整資料：${query}` }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: { responseMimeType: "application/json", responseSchema: jsonSchema }
          })
        });

        const result = await response.json();
        if (result.error) throw new Error(result.error.message);

        const bookData = JSON.parse(result.candidates[0].content.parts[0].text);
        document.getElementById('titleZh').value = bookData.book_title_zh || '';
        document.getElementById('titleOrig').value = bookData.book_title_original || '';
        document.getElementById('authors').value = (bookData.authors || []).join(', ');
        document.getElementById('publisher').value = bookData.publisher || '';
        document.getElementById('pubDate').value = bookData.publication_date || '';
        document.getElementById('summary').value = bookData.summary || '';
        
        if (bookData.categories) {
          bookData.categories.forEach(c => {
            if (!defaultCategories.includes(c)) defaultCategories.push(c);
            selectedCategories.add(c);
          });
          renderCategories();
        }

        const linkEl = document.getElementById('booksLink');
        const searchKey = encodeURIComponent(query);
        linkEl.href = bookData.books_link || `https://search.books.com.tw/search/query/key/${searchKey}/cat/all`;
        linkEl.innerText = '點此前往博客來搜尋頁面';

      } catch (e) {
        alert('AI 檢索失敗：' + e.message);
      }
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          updateCoverPreview(e.target.result);
          document.getElementById('coverUrl').value = '';
        };
        reader.readAsDataURL(file);
      }
    }

    document.getElementById('coverUrl').addEventListener('input', (e) => updateCoverPreview(e.target.value.trim()));

    function updateCoverPreview(src) {
      const img = document.getElementById('coverPreview');
      const text = document.getElementById('noCoverText');
      if (src) {
        img.src = src;
        img.classList.remove('hidden');
        text.classList.add('hidden');
      } else {
        img.src = '';
        img.classList.add('hidden');
        text.classList.remove('hidden');
      }
    }

    // 預設啟動書櫃渲染
    renderShelf();
  </script>
</body>
