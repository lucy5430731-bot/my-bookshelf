<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的個人讀書紀錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold text-slate-800 mb-6 text-center">📚 個人讀書紀錄器</h1>
    
    <!-- API Key 設定 -->
    <div class="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-xl">
      <label class="block text-sm font-semibold text-amber-900 mb-1">Google AI Studio API Key：</label>
      <input type="password" id="apiKey" placeholder="貼上你的 API Key (AIzaSy...)" class="w-full p-2 border border-amber-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
      <p class="text-xs text-amber-700 mt-1">※ Key 會自動存在瀏覽器中，不會傳送給第三方。</p>
    </div>

    <!-- 搜尋與帶入 -->
    <div class="mb-8 flex gap-2">
      <input type="text" id="bookSearchInput" placeholder="輸入中文書名或 ISBN 碼..." class="flex-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      <button onclick="fetchBookInfo()" id="searchBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-3 rounded-xl transition flex items-center gap-2">
        <span>✨ AI 自動帶入</span>
      </button>
    </div>

    <!-- 表單內容 -->
    <div id="bookForm" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- 封面預覽 -->
        <div class="flex flex-col items-center">
          <div class="w-36 h-48 bg-slate-200 rounded-lg overflow-hidden flex items-center justify-center text-slate-400 border border-slate-300 mb-2">
            <img id="coverPreview" src="" class="w-full h-full object-cover hidden">
            <span id="noCoverText" class="text-xs text-center p-2">暫無封面</span>
          </div>
          <input type="text" id="coverUrl" placeholder="圖片網址 (可自訂替換)" class="w-full text-xs p-2 border rounded-lg">
        </div>

        <!-- 書籍基本資料 -->
        <div class="md:col-span-2 space-y-3">
          <div>
            <label class="block text-xs text-slate-500 font-medium">中文書名</label>
            <input type="text" id="titleZh" class="w-full p-2 border border-slate-300 rounded-lg text-sm font-bold">
          </div>
          <div>
            <label class="block text-xs text-slate-500 font-medium">原文書名</label>
            <input type="text" id="titleOrig" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs text-slate-500 font-medium">作者</label>
              <input type="text" id="authors" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs text-slate-500 font-medium">出版社</label>
              <input type="text" id="publisher" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs text-slate-500 font-medium">出版日期 / 分類</label>
              <input type="text" id="pubDate" placeholder="2024-01 / 心理學" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs text-slate-500 font-medium">博客來連結</label>
              <a id="booksLink" href="#" target="_blank" class="text-xs text-indigo-600 underline block mt-2 truncate">尚未產生</a>
            </div>
          </div>
        </div>
      </div>

      <!-- 簡介 -->
      <div>
        <label class="block text-xs text-slate-500 font-medium mb-1">書籍簡介</label>
        <textarea id="summary" rows="2" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-slate-50"></textarea>
      </div>

      <hr class="border-slate-200 my-4">

      <!-- 個人閱讀紀錄區 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">閱讀狀態</label>
          <select id="status" class="w-full p-2 border rounded-lg text-sm bg-white">
            <option value="已完讀">已完讀</option>
            <option value="閱讀中">閱讀中</option>
            <option value="想讀">想讀</option>
            <option value="棄書">棄書</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">完讀日期</label>
          <input type="date" id="finishDate" class="w-full p-2 border rounded-lg text-sm bg-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">星等評分 (0–5)</label>
          <select id="rating" class="w-full p-2 border rounded-lg text-sm bg-white">
            <option value="5.0">⭐⭐⭐⭐⭐ (5.0)</option>
            <option value="4.5">⭐⭐⭐⭐✨ (4.5)</option>
            <option value="4.0">⭐⭐⭐⭐ (4.0)</option>
            <option value="3.5">⭐⭐⭐✨ (3.5)</option>
            <option value="3.0">⭐⭐⭐ (3.0)</option>
            <option value="2.5">⭐⭐✨ (2.5)</option>
            <option value="2.0">⭐⭐ (2.0)</option>
            <option value="1.0">⭐ (1.0)</option>
          </select>
        </div>
      </div>

      <!-- 金句與心得 -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">喜歡的金句 / 佳句摘錄</label>
        <textarea id="quotes" rows="2" placeholder="輸入喜歡的句子..." class="w-full p-2 border border-slate-300 rounded-lg text-sm"></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">閱讀心得 / 隨筆</label>
        <textarea id="notes" rows="3" placeholder="記錄這本書帶給你的想法..." class="w-full p-2 border border-slate-300 rounded-lg text-sm"></textarea>
      </div>

      <button onclick="saveRecord()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg">
        💾 儲存讀書紀錄
      </button>
    </div>
  </div>

  <script>
    // 預設帶入今天的日期
    document.getElementById('finishDate').valueAsDate = new Date();

    // 載入本地儲存的 API Key
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) document.getElementById('apiKey').value = savedKey;

    document.getElementById('apiKey').addEventListener('change', (e) => {
      localStorage.setItem('gemini_api_key', e.target.value.trim());
    });

    async function fetchBookInfo() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const query = document.getElementById('bookSearchInput').value.trim();

      if (!apiKey) return alert('請先輸入 Google AI Studio API Key！');
      if (!query) return alert('請輸入書名或 ISBN！');

      const btn = document.getElementById('searchBtn');
      btn.innerText = '🔍 正在搜尋分析中...';
      btn.disabled = true;

      const systemPrompt = "你是一個專業圖書整理員。當收到書名或ISBN，請搜尋資料並以 strict JSON 格式回傳資訊。博客來連結請優先使用此搜尋格式：https://www.books.com.tw/seek/exep/main_search.php?key=【ISBN或關鍵字】";
      const jsonSchema = {
        type: "OBJECT",
        properties: {
          book_title_zh: { type: "STRING" },
          book_title_original: { type: "STRING" },
          authors: { type: "ARRAY", items: { type: "STRING" } },
          publisher: { type: "STRING" },
          publication_date: { type: "STRING" },
          categories: { type: "ARRAY", items: { type: "STRING" } },
          summary: { type: "STRING" },
          books_link: { type: "STRING" },
          cover_image_url: { type: "STRING" }
        },
        required: ["book_title_zh", "authors", "publisher", "summary", "books_link"]
      };

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `請檢索這本書的完整資料：${query}` }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: jsonSchema
            }
          })
        });

        const data = await response.json();

        // 檢查 API 是否回傳錯誤
        if (data.error) {
          alert(`Google API 呼叫失敗：${data.error.message} (錯誤碼: ${data.error.code})`);
          return;
        }

        if (!data.candidates || !data.candidates[0]?.content?.parts[0]?.text) {
          alert('未能順利取得資料，請確認 API Key 是否正確或改用中文書名搜尋。');
          return;
        }

        const bookData = JSON.parse(data.candidates[0].content.parts[0].text);

        // 填入表單
        document.getElementById('titleZh').value = bookData.book_title_zh || '';
        document.getElementById('titleOrig').value = bookData.book_title_original || '';
        document.getElementById('authors').value = (bookData.authors || []).join(', ');
        document.getElementById('publisher').value = bookData.publisher || '';
        document.getElementById('pubDate').value = `${bookData.publication_date || ''} / ${(bookData.categories || []).join(', ')}`;
        document.getElementById('summary').value = bookData.summary || '';
        
        const linkEl = document.getElementById('booksLink');
        linkEl.href = bookData.books_link || '#';
        linkEl.innerText = '點此前往博客來商品頁';

        if (bookData.cover_image_url) {
          document.getElementById('coverUrl').value = bookData.cover_image_url;
          updateCoverPreview(bookData.cover_image_url);
        } else {
          document.getElementById('coverUrl').value = '';
          updateCoverPreview('');
        }

      } catch (err) {
        alert('發生連線錯誤或解析失敗：' + err.message);
        console.error(err);
      } finally {
        btn.innerText = '✨ AI 自動帶入';
        btn.disabled = false;
      }
    }

    document.getElementById('coverUrl').addEventListener('input', (e) => {
      updateCoverPreview(e.target.value.trim());
    });

    function updateCoverPreview(url) {
      const img = document.getElementById('coverPreview');
      const text = document.getElementById('noCoverText');
      if (url) {
        img.src = url;
        img.classList.remove('hidden');
        text.classList.add('hidden');
      } else {
        img.classList.add('hidden');
        text.classList.remove('hidden');
      }
    }

    function saveRecord() {
      alert('紀錄已暫存！（下一步可為你串接 Google Sheets 或免費資料庫）');
    }
  </script>
</body>
</html>
