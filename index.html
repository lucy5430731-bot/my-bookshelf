<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的個人讀書紀錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .tag-btn.active { background-color: #4f46e5; color: white; border-color: #4f46e5; }
    .tab-btn.active { border-bottom: 3px solid #4f46e5; color: #4f46e5; font-weight: bold; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans text-slate-800">
  <div class="max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-xl">
    
    <!-- 頂部 Header & Tabs -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-slate-200 gap-4">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-800 flex items-center gap-2">
        <span>📚</span> 我的個人讀書紀錄 <span id="cloudStatus" class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-normal">☁️ 雲端同步中</span>
      </h1>
      <div class="flex gap-4 border-b md:border-b-0 w-full md:w-auto justify-center">
        <button onclick="switchTab('shelf')" id="tab-shelf" class="tab-btn active pb-2 px-3 text-sm md:text-base">📚 我的書櫃</button>
        <button onclick="switchTab('add')" id="tab-add" class="tab-btn pb-2 px-3 text-sm md:text-base">➕ 新增書籍</button>
        <button onclick="switchTab('analytics')" id="tab-analytics" class="tab-btn pb-2 px-3 text-sm md:text-base">📊 閱讀分析</button>
      </div>
    </div>

    <!-- TAB 1: 我的書櫃 -->
    <div id="view-shelf" class="space-y-6">
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-1 md:grid-cols-5 gap-3 items-center">
        <input type="text" id="searchInput" oninput="filterBooks()" placeholder="🔍 搜尋書名、作者..." class="p-2 border rounded-lg text-sm md:col-span-1">
        
        <select id="filterStatus" onchange="filterBooks()" class="p-2 border rounded-lg text-sm bg-white">
          <option value="全部">所有閱讀狀態</option>
          <option value="已完讀">已完讀</option>
          <option value="閱讀中">閱讀中</option>
          <option value="想讀">想讀</option>
          <option value="棄書">棄書</option>
        </select>

        <select id="filterCategory" onchange="filterBooks()" class="p-2 border rounded-lg text-sm bg-white">
          <option value="全部">所有主分類</option>
        </select>

        <select id="sortBy" onchange="filterBooks()" class="p-2 border rounded-lg text-sm bg-white">
          <option value="finishDateDesc">完讀日期 (最新到最舊)</option>
          <option value="ratingDesc">星等評分 (高到低)</option>
        </select>

        <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium p-2 rounded-lg text-xs md:text-sm transition flex items-center justify-center gap-1 shadow-sm">
          📥 匯出 EXCEL
        </button>
      </div>

      <div id="bookGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </div>

    <!-- TAB 2: 新增/編輯書籍表單 -->
    <div id="view-add" class="hidden space-y-6">
      <div id="formContainer" class="p-6 rounded-2xl border transition-all duration-300 bg-slate-50 border-slate-200 space-y-6">
        <input type="hidden" id="editingBookId" value="">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="flex flex-col items-center">
            <div class="w-36 h-48 bg-white rounded-lg overflow-hidden flex items-center justify-center text-slate-400 border border-slate-300 mb-3 relative shadow-sm">
              <img id="coverPreview" src="" class="w-full h-full object-cover hidden">
              <span id="noCoverText" class="text-xs text-center p-2">暫無封面</span>
            </div>
            
            <div class="w-full space-y-2">
              <label class="block w-full text-center bg-white hover:bg-slate-100 text-slate-700 text-xs py-2 px-3 rounded-lg border border-slate-300 cursor-pointer font-medium transition shadow-sm">
                📷 選擇上傳圖片
                <input type="file" id="coverFileInput" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
              </label>
              <input type="text" id="coverUrl" placeholder="或貼上圖片網址..." class="w-full text-xs p-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
            </div>
          </div>

          <div class="md:col-span-2 space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600">主要書籍分類 *</label>
              <select id="primaryCategory" onchange="onPrimaryCategoryChange()" class="w-full p-2 border border-indigo-300 rounded-lg text-sm font-bold bg-white focus:ring-2 focus:ring-indigo-500">
              </select>
            </div>

            <div>
              <label class="block text-xs text-slate-500 font-medium">中文書名 *</label>
              <input type="text" id="titleZh" class="w-full p-2 border border-slate-300 rounded-lg text-sm font-bold bg-white">
            </div>
            <div>
              <label class="block text-xs text-slate-500 font-medium">原文書名 / 副標題</label>
              <input type="text" id="titleOrig" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 font-medium">作者</label>
                <input type="text" id="authors" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white">
              </div>
              <div>
                <label class="block text-xs text-slate-500 font-medium">出版社</label>
                <input type="text" id="publisher" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 font-medium">出版日期</label>
                <input type="text" id="pubDate" placeholder="YYYY-MM-DD" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white">
              </div>
              <div>
                <label class="block text-xs text-slate-500 font-medium">博客來連結</label>
                <input type="text" id="booksLink" placeholder="https://..." class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white">
              </div>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-500 font-medium mb-2">次要主題標籤 (可多選)</label>
          <div id="tagContainer" class="flex flex-wrap gap-2 mb-3"></div>
          
          <div class="p-3 bg-white/80 rounded-xl border border-slate-200 flex gap-2 items-center">
            <input type="text" id="customTagInput" placeholder="自訂新標籤 (如：時間管理)..." class="text-xs p-2 border rounded-lg flex-1">
            <button onclick="addCustomTag()" type="button" class="text-xs bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg font-medium transition flex-shrink-0">新增標籤</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white/70 p-4 rounded-xl border border-slate-200">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">📱 閱讀載體</label>
            <select id="medium" class="w-full p-2 border rounded-lg text-sm bg-white">
              <option value="紙本書">📖 紙本書</option>
              <option value="電子書">📱 電子書</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">🛒 閱讀來源</label>
            <select id="source" class="w-full p-2 border rounded-lg text-sm bg-white">
              <option value="自己購買">💰 自己購買</option>
              <option value="圖書館借閱">🏛️ 圖書館借閱</option>
              <option value="朋友借閱">🤝 朋友借閱</option>
              <option value="電子書訂閱制">♾️ 電子書暢讀訂閱</option>
              <option value="其他">其他</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-500 font-medium mb-1">書籍簡介</label>
          <textarea id="summary" rows="3" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white"></textarea>
        </div>

        <hr class="border-slate-200 my-4">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">閱讀狀態</label>
            <select id="status" class="w-full p-2 border rounded-lg text-sm bg-white">
              <option value="已完讀">已完讀</option>
              <option value="閱讀中">閱讀中</option>
              <option value="想讀">想讀</option>
              <option value="棄書">棄書</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">完讀日期</label>
            <input type="date" id="finishDate" class="w-full p-2 border rounded-lg text-sm bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">星等評分 (0–5)</label>
            <select id="rating" class="w-full p-2 border rounded-lg text-sm bg-white">
              <option value="5.0">⭐⭐⭐⭐⭐ (5.0)</option>
              <option value="4.5">⭐⭐⭐⭐✨ (4.5)</option>
              <option value="4.0">⭐⭐⭐⭐ (4.0)</option>
              <option value="3.5">⭐⭐⭐✨ (3.5)</option>
              <option value="3.0">⭐⭐⭐ (3.0)</option>
              <option value="2.5">⭐⭐✨ (2.5)</option>
              <option value="2.0">⭐⭐ (2.0)</option>
              <option value="1.0">⭐ (1.0)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">佳句摘錄</label>
          <textarea id="quotes" rows="2" placeholder="輸入喜歡的句子..." class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">閱讀心得 / 隨筆</label>
          <textarea id="notes" rows="3" placeholder="記錄這本書帶給你的想法..." class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white"></textarea>
        </div>

        <button onclick="saveRecord()" id="saveBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg">
          💾 儲存讀書紀錄至雲端
        </button>
      </div>
    </div>

    <!-- TAB 3: 閱讀分析數據 -->
    <div id="view-analytics" class="hidden space-y-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-indigo-50 p-4 rounded-xl text-center border border-indigo-100">
          <p class="text-xs text-indigo-600 font-bold">2026 完讀總本數</p>
          <p id="stat-total-2026" class="text-2xl md:text-3xl font-extrabold text-indigo-900 mt-1">0 本</p>
        </div>
        <div class="bg-amber-50 p-4 rounded-xl text-center border border-amber-100">
          <p class="text-xs text-amber-600 font-bold">平均評分</p>
          <p id="stat-avg-rating" class="text-2xl md:text-3xl font-extrabold text-amber-900 mt-1">0.0 ⭐</p>
        </div>
        <div class="bg-emerald-50 p-4 rounded-xl text-center border border-emerald-100">
          <p class="text-xs text-emerald-600 font-bold">偏好載體</p>
          <p id="stat-top-medium" class="text-2xl md:text-3xl font-extrabold text-emerald-900 mt-1 truncate">-</p>
        </div>
        <div class="bg-purple-50 p-4 rounded-xl text-center border border-purple-100">
          <p class="text-xs text-purple-600 font-bold">最常閱讀主分類</p>
          <p id="stat-top-category" class="text-2xl md:text-3xl font-extrabold text-purple-900 mt-1 truncate">-</p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <h3 class="text-sm font-bold text-slate-700 mb-2 text-center">🍕 閱讀類型占比</h3>
          <p class="text-[10px] text-slate-400 text-center mb-3">100% 精準對應實際完讀書本總數</p>
          <canvas id="primaryCategoryChart"></canvas>
        </div>
        
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between">
          <div>
            <h3 class="text-sm font-bold text-slate-700 mb-1 text-center">🏷️ 標籤出現頻率</h3>
            <p class="text-[10px] text-slate-400 text-center mb-4">依據書籍標註的熱門標籤數量由多到少排列</p>
            <div id="tagsRankList" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
          </div>
        </div>

        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <h3 class="text-sm font-bold text-slate-700 mb-4 text-center">⭐ 評分分布統計</h3>
          <canvas id="ratingChart"></canvas>
        </div>

        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <h3 class="text-sm font-bold text-slate-700 mb-4 text-center">📱 閱讀載體與來源占比</h3>
          <canvas id="mediumChart"></canvas>
        </div>
      </div>
    </div>

  </div>

  <!-- 書籍 Modal -->
  <div id="bookModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
      
      <div class="flex gap-4">
        <img id="modalCover" src="" class="w-24 h-32 object-cover rounded-lg border flex-shrink-0">
        <div>
          <span id="modalPrimaryCat" class="text-[10px] px-2 py-0.5 rounded-full font-bold mb-1 inline-block"></span>
          <h2 id="modalTitleZh" class="text-lg font-bold text-slate-800"></h2>
          <p id="modalTitleOrig" class="text-xs text-slate-500 mb-2"></p>
          <p class="text-xs text-slate-600">作者：<span id="modalAuthors"></span></p>
          <p class="text-xs text-slate-600">載體 / 來源：<span id="modalMediumSource"></span></p>
          <p class="text-xs text-slate-600">完讀日期：<span id="modalFinishDate"></span></p>
          <div id="modalRating" class="mt-1 text-amber-500 font-bold text-sm"></div>
        </div>
      </div>

      <div id="modalCategories" class="flex flex-wrap gap-1"></div>

      <div class="bg-slate-50 p-3 rounded-lg text-xs space-y-1">
        <p class="font-bold text-slate-700">【書籍簡介】</p>
        <p id="modalSummary" class="text-slate-600 leading-relaxed"></p>
      </div>

      <div class="bg-amber-50/60 p-3 rounded-lg text-xs border border-amber-200/60 space-y-1">
        <p class="font-bold text-amber-900">💬 佳句摘錄：</p>
        <p id="modalQuotes" class="text-amber-800 italic"></p>
      </div>

      <div class="bg-indigo-50/60 p-3 rounded-lg text-xs border border-indigo-200/60 space-y-1">
        <p class="font-bold text-indigo-900">📝 閱讀心得與筆記：</p>
        <p id="modalNotes" class="text-indigo-800 leading-relaxed"></p>
      </div>

      <a id="modalBooksLink" href="#" target="_blank" class="block text-center text-xs text-indigo-600 underline">前往商品連結</a>

      <div class="grid grid-cols-2 gap-2 pt-2">
        <button onclick="editBook()" class="bg-amber-50 border border-amber-200 text-amber-700 hover:bg-amber-100 text-xs py-2 rounded-lg font-medium transition">✏️ 編輯書籍資料</button>
        <button onclick="deleteBook()" class="bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100 text-xs py-2 rounded-lg font-medium transition">🗑️ 刪除此紀錄</button>
      </div>
    </div>
  </div>

  <script>
    // 已自動帶入你的專屬 Supabase 資訊
    const SUPABASE_URL = 'https://iuvzixotdxlpdzvhbgph.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dnppeG90ZHhscGR6dmhiZ3BoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2OTQ5MDMsImV4cCI6MjEwNjI3MDkwM30.ezI8Y24n1qbywbo-19e9N7e6FUUsXgsCpjk3hNLRNAQ';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const categoryConfig = {
      '文學小說': { color: '#ec4899', bgClass: 'bg-pink-50', borderClass: 'border-pink-200' },
      '商業理財': { color: '#3b82f6', bgClass: 'bg-blue-50', borderClass: 'border-blue-200' },
      '藝術設計': { color: '#8b5cf6', bgClass: 'bg-purple-50', borderClass: 'border-purple-200' },
      '人文社科': { color: '#f59e0b', bgClass: 'bg-amber-50', borderClass: 'border-amber-200' },
      '心理勵志': { color: '#10b981', bgClass: 'bg-emerald-50', borderClass: 'border-emerald-200' },
      '自然科普': { color: '#0284c7', bgClass: 'bg-sky-50', borderClass: 'border-sky-200' },
      '醫療保健': { color: '#059669', bgClass: 'bg-teal-50', borderClass: 'border-teal-200' },
      '飲食':     { color: '#f97316', bgClass: 'bg-orange-50', borderClass: 'border-orange-200' },
      '生活風格': { color: '#d946ef', bgClass: 'bg-fuchsia-50', borderClass: 'border-fuchsia-200' },
      '旅遊':     { color: '#14b8a6', bgClass: 'bg-emerald-50/70', borderClass: 'border-emerald-200' },
      '其他類型': { color: '#64748b', bgClass: 'bg-slate-50', borderClass: 'border-slate-200' }
    };

    let defaultTags = JSON.parse(localStorage.getItem('my_tags') || JSON.stringify([
      '個人成長', '習慣養成', '時間管理', '人際溝通', '情緒整理', '女性主義', '西班牙文化', '棒球歷史'
    ]));

    let books = [];
    let selectedTags = new Set();
    let currentModalBookId = null;

    async function loadBooksFromCloud() {
      document.getElementById('cloudStatus').innerText = '🔄 同步中...';
      const { data, error } = await supabaseClient.from('books').select('*').order('created_at', { ascending: false });
      if (error) {
        console.error(error);
        document.getElementById('cloudStatus').innerText = '❌ 同步失敗';
        return;
      }
      
      books = data.map(b => ({
        id: b.id,
        primaryCategory: b.primary_category,
        titleZh: b.title_zh,
        titleOrig: b.title_orig,
        authors: b.authors,
        publisher: b.publisher,
        pubDate: b.pub_date,
        medium: b.medium,
        source: b.source,
        summary: b.summary,
        coverUrl: b.cover_url,
        booksLink: b.books_link,
        tags: b.tags || [],
        status: b.status,
        finishDate: b.finish_date,
        rating: b.rating,
        quotes: b.quotes,
        notes: b.notes
      }));

      document.getElementById('cloudStatus').innerText = '☁️ 雲端同步完成';
      renderShelf();
    }

    function initCategorySelects() {
      const primarySelect = document.getElementById('primaryCategory');
      primarySelect.innerHTML = '';
      Object.keys(categoryConfig).forEach(cat => {
        primarySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    function onPrimaryCategoryChange() {
      const selected = document.getElementById('primaryCategory').value;
      const config = categoryConfig[selected] || categoryConfig['其他類型'];
      const form = document.getElementById('formContainer');
      form.className = `p-6 rounded-2xl border transition-all duration-300 space-y-6 ${config.bgClass} ${config.borderClass}`;
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');

      document.getElementById('view-shelf').classList.add('hidden');
      document.getElementById('view-add').classList.add('hidden');
      document.getElementById('view-analytics').classList.add('hidden');

      document.getElementById(`view-${tabName}`).classList.remove('hidden');

      if (tabName === 'shelf') renderShelf();
      if (tabName === 'analytics') renderAnalytics();
      if (tabName === 'add' && !document.getElementById('editingBookId').value) resetForm();
    }

    function renderShelf() {
      const filterCatSelect = document.getElementById('filterCategory');
      filterCatSelect.innerHTML = '<option value="全部">所有主分類</option>';
      Object.keys(categoryConfig).forEach(cat => {
        filterCatSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
      });

      filterBooks();
    }

    function filterBooks() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('filterStatus').value;
      const category = document.getElementById('filterCategory').value;
      const sortBy = document.getElementById('sortBy').value;

      let filtered = books.filter(b => {
        const matchesSearch = (b.titleZh || '').toLowerCase().includes(search) ||
                              (b.authors || '').toLowerCase().includes(search) ||
                              (b.notes || '').toLowerCase().includes(search) ||
                              (b.quotes || '').toLowerCase().includes(search);
        
        const matchesStatus = status === '全部' || b.status === status;
        const matchesCat = category === '全部' || b.primaryCategory === category;

        return matchesSearch && matchesStatus && matchesCat;
      });

      filtered.sort((a, b) => {
        if (sortBy === 'finishDateDesc') return new Date(b.finishDate || 0) - new Date(a.finishDate || 0);
        if (sortBy === 'ratingDesc') return parseFloat(b.rating || 0) - parseFloat(a.rating || 0);
      });

      const grid = document.getElementById('bookGrid');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">尚無書籍資料，點擊頂部「➕ 新增書籍」開始記錄吧！</div>`;
        return;
      }

      filtered.forEach(book => {
        const config = categoryConfig[book.primaryCategory] || categoryConfig['其他類型'];
        const card = document.createElement('div');
        card.className = `border rounded-xl overflow-hidden shadow-sm hover:shadow-md transition cursor-pointer flex flex-col ${config.bgClass} ${config.borderClass}`;
        card.onclick = () => openModal(book.id);

        const coverSrc = book.coverUrl || 'https://via.placeholder.com/150x200?text=No+Cover';
        const stars = '⭐'.repeat(Math.floor(parseFloat(book.rating || 0)));

        card.innerHTML = `
          <div class="h-44 bg-slate-200 overflow-hidden relative">
            <img src="${coverSrc}" class="w-full h-full object-cover">
            <span class="absolute top-2 right-2 text-[10px] bg-slate-800/80 text-white px-2 py-0.5 rounded-full">${book.status || '已完讀'}</span>
            <span class="absolute bottom-2 left-2 text-[9px] font-bold text-white bg-indigo-600/90 px-1.5 py-0.5 rounded">${book.primaryCategory || '文學小說'}</span>
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between space-y-1">
            <div>
              <h3 class="font-bold text-xs line-clamp-1 text-slate-800">${book.titleZh}</h3>
              <p class="text-[10px] text-slate-500 line-clamp-1">${book.authors || '未知作者'}</p>
            </div>
            <div class="pt-2 border-t border-slate-200/60 flex justify-between items-center text-[10px] text-slate-500">
              <span>${stars || '無評分'}</span>
              <span>${book.finishDate || ''}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(id) {
      const book = books.find(b => b.id === id);
      if (!book) return;

      currentModalBookId = id;
      document.getElementById('modalCover').src = book.coverUrl || 'https://via.placeholder.com/150x200?text=No+Cover';
      document.getElementById('modalPrimaryCat').innerText = book.primaryCategory || '未分類';
      document.getElementById('modalTitleZh').innerText = book.titleZh;
      document.getElementById('modalTitleOrig').innerText = book.titleOrig || '';
      document.getElementById('modalAuthors').innerText = book.authors || '無';
      document.getElementById('modalMediumSource').innerText = `${book.medium || '紙本書'} (${book.source || '自己購買'})`;
      document.getElementById('modalFinishDate').innerText = book.finishDate || '未紀錄';
      document.getElementById('modalRating').innerText = `⭐ ${book.rating} / 5.0`;
      document.getElementById('modalSummary').innerText = book.summary || '無簡介';
      document.getElementById('modalQuotes').innerText = book.quotes || '尚無紀錄佳句';
      document.getElementById('modalNotes').innerText = book.notes || '尚無紀錄心得';
      
      const linkEl = document.getElementById('modalBooksLink');
      linkEl.href = book.booksLink || '#';

      const catEl = document.getElementById('modalCategories');
      catEl.innerHTML = '';
      (book.tags || []).forEach(c => {
        catEl.innerHTML += `<span class="bg-indigo-50 text-indigo-600 text-[10px] px-2 py-0.5 rounded-md font-medium border border-indigo-100">#${c}</span>`;
      });

      document.getElementById('bookModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('bookModal').classList.add('hidden');
    }

    function editBook() {
      const book = books.find(b => b.id === currentModalBookId);
      if (!book) return;

      closeModal();
      document.getElementById('editingBookId').value = book.id;
      document.getElementById('primaryCategory').value = book.primaryCategory || '文學小說';
      onPrimaryCategoryChange();

      document.getElementById('titleZh').value = book.titleZh || '';
      document.getElementById('titleOrig').value = book.titleOrig || '';
      document.getElementById('authors').value = book.authors || '';
      document.getElementById('publisher').value = book.publisher || '';
      document.getElementById('pubDate').value = book.pubDate || '';
      document.getElementById('booksLink').value = book.booksLink || '';
      document.getElementById('summary').value = book.summary || '';
      document.getElementById('coverUrl').value = book.coverUrl || '';
      updateCoverPreview(book.coverUrl || '');
      
      document.getElementById('medium').value = book.medium || '紙本書';
      document.getElementById('source').value = book.source || '自己購買';

      selectedTags = new Set(book.tags || []);
      renderTags();

      document.getElementById('status').value = book.status || '已完讀';
      document.getElementById('finishDate').value = book.finishDate || '';
      document.getElementById('rating').value = book.rating || '5.0';
      document.getElementById('quotes').value = book.quotes || '';
      document.getElementById('notes').value = book.notes || '';

      document.getElementById('saveBtn').innerText = '💾 更新書籍紀錄';
      switchTab('add');
    }

    async function deleteBook() {
      if (confirm('確定要刪除這本書的紀錄嗎？')) {
        const { error } = await supabaseClient.from('books').delete().eq('id', currentModalBookId);
        if (error) return alert('刪除失敗：' + error.message);

        closeModal();
        await loadBooksFromCloud();
      }
    }

    async function saveRecord() {
      const titleZh = document.getElementById('titleZh').value.trim();
      if (!titleZh) return alert('請填寫中文書名！');

      const editingId = document.getElementById('editingBookId').value;
      const bookId = editingId || Date.now().toString();

      const payload = {
        id: bookId,
        primary_category: document.getElementById('primaryCategory').value,
        title_zh: titleZh,
        title_orig: document.getElementById('titleOrig').value,
        authors: document.getElementById('authors').value,
        publisher: document.getElementById('publisher').value,
        pub_date: document.getElementById('pubDate').value,
        medium: document.getElementById('medium').value,
        source: document.getElementById('source').value,
        summary: document.getElementById('summary').value,
        cover_url: document.getElementById('coverUrl').value,
        books_link: document.getElementById('booksLink').value,
        tags: Array.from(selectedTags),
        status: document.getElementById('status').value,
        finish_date: document.getElementById('finishDate').value,
        rating: document.getElementById('rating').value,
        quotes: document.getElementById('quotes').value,
        notes: document.getElementById('notes').value
      };

      const { error } = await supabaseClient.from('books').upsert(payload);
      if (error) return alert('儲存失敗：' + error.message);

      alert(editingId ? '🎉 雲端紀錄更新成功！' : '🎉 成功新增書籍至雲端！');
      resetForm();
      await loadBooksFromCloud();
      switchTab('shelf');
    }

    function resetForm() {
      document.getElementById('editingBookId').value = '';
      document.getElementById('primaryCategory').value = '文學小說';
      onPrimaryCategoryChange();
      document.getElementById('titleZh').value = '';
      document.getElementById('titleOrig').value = '';
      document.getElementById('authors').value = '';
      document.getElementById('publisher').value = '';
      document.getElementById('pubDate').value = '';
      document.getElementById('booksLink').value = '';
      document.getElementById('summary').value = '';
      document.getElementById('coverUrl').value = '';
      updateCoverPreview('');
      selectedTags.clear();
      renderTags();
      document.getElementById('status').value = '已完讀';
      document.getElementById('finishDate').valueAsDate = new Date();
      document.getElementById('rating').value = '5.0';
      document.getElementById('quotes').value = '';
      document.getElementById('notes').value = '';
      document.getElementById('saveBtn').innerText = '💾 儲存讀書紀錄至雲端';
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxW = 300;
            const scale = maxW / img.width;
            canvas.width = maxW;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const compressedUrl = canvas.toDataURL('image/jpeg', 0.7);
            document.getElementById('coverUrl').value = compressedUrl;
            updateCoverPreview(compressedUrl);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    document.getElementById('coverUrl').addEventListener('input', (e) => updateCoverPreview(e.target.value.trim()));

    function updateCoverPreview(src) {
      const img = document.getElementById('coverPreview');
      const text = document.getElementById('noCoverText');
      if (src) {
        img.src = src;
        img.classList.remove('hidden');
        text.classList.add('hidden');
      } else {
        img.src = '';
        img.classList.add('hidden');
        text.classList.remove('hidden');
      }
    }

    function renderTags() {
      const container = document.getElementById('tagContainer');
      container.innerHTML = '';
      defaultTags.forEach(tag => {
        const wrapper = document.createElement('div');
        wrapper.className = 'inline-flex items-center group relative';

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `tag-btn text-xs px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600 font-medium ${selectedTags.has(tag) ? 'active' : ''}`;
        btn.innerText = `#${tag}`;
        btn.onclick = () => {
          if (selectedTags.has(tag)) selectedTags.delete(tag);
          else selectedTags.add(tag);
          renderTags();
        };

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'ml-1 text-[10px] text-slate-400 hover:text-rose-500 font-bold px-1 transition';
        delBtn.innerText = '✕';
        delBtn.title = '刪除此標籤';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteCustomTag(tag);
        };

        wrapper.appendChild(btn);
        wrapper.appendChild(delBtn);
        container.appendChild(wrapper);
      });
    }

    function addCustomTag() {
      const input = document.getElementById('customTagInput');
      const val = input.value.trim().replace(/^#/, '');
      if (val && !defaultTags.includes(val)) {
        defaultTags.push(val);
        selectedTags.add(val);
        localStorage.setItem('my_tags', JSON.stringify(defaultTags));
        renderTags();
        input.value = '';
      }
    }

    function deleteCustomTag(tagToDelete) {
      if (confirm(`確定要刪除標籤「#${tagToDelete}」嗎？`)) {
        defaultTags = defaultTags.filter(t => t !== tagToDelete);
        selectedTags.delete(tagToDelete);
        localStorage.setItem('my_tags', JSON.stringify(defaultTags));
        renderTags();
      }
    }

    function exportToExcel() {
      if (books.length === 0) return alert('目前沒有任何書籍紀錄可以匯出！');

      const headers = ['中文書名', '原文書名', '作者', '出版社', '出版日期', '主分類', '標籤', '閱讀狀態', '完讀日期', '星等評分', '閱讀載體', '閱讀來源', '金句摘錄', '閱讀心得', '商品連結'];

      const rows = books.map(b => [
        `"${(b.titleZh || '').replace(/"/g, '""')}"`,
        `"${(b.titleOrig || '').replace(/"/g, '""')}"`,
        `"${(b.authors || '').replace(/"/g, '""')}"`,
        `"${(b.publisher || '').replace(/"/g, '""')}"`,
        `"${b.pubDate || ''}"`,
        `"${b.primaryCategory || ''}"`,
        `"${(b.tags || []).join('; ')}"`,
        `"${b.status || ''}"`,
        `"${b.finishDate || ''}"`,
        `"${b.rating || ''}"`,
        `"${b.medium || ''}"`,
        `"${b.source || ''}"`,
        `"${(b.quotes || '').replace(/"/g, '""')}"`,
        `"${(b.notes || '').replace(/"/g, '""')}"`,
        `"${b.booksLink || ''}"`
      ]);

      const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement('a');
      link.href = url;
      link.download = `我的個人讀書紀錄_${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    let primaryCatChartInstance = null;
    let ratingChartInstance = null;
    let mediumChartInstance = null;

    function renderAnalytics() {
      const year2026Books = books.filter(b => (b.finishDate || '').startsWith('2026') && b.status === '已完讀');
      document.getElementById('stat-total-2026').innerText = `${year2026Books.length} 本`;

      if (books.length > 0) {
        const avg = (books.reduce((acc, b) => acc + parseFloat(b.rating || 0), 0) / books.length).toFixed(1);
        document.getElementById('stat-avg-rating').innerText = `${avg} ⭐`;
      }

      const mediumMap = {};
      books.forEach(b => { mediumMap[b.medium || '紙本書'] = (mediumMap[b.medium || '紙本書'] || 0) + 1; });
      const topMedium = Object.entries(mediumMap).sort((a,b) => b[1] - a[1])[0];
      document.getElementById('stat-top-medium').innerText = topMedium ? topMedium[0] : '-';

      const primaryCatMap = {};
      books.forEach(b => { primaryCatMap[b.primaryCategory || '文學小說'] = (primaryCatMap[b.primaryCategory || '文學小說'] || 0) + 1; });
      const topCat = Object.entries(primaryCatMap).sort((a,b) => b[1] - a[1])[0];
      document.getElementById('stat-top-category').innerText = topCat ? topCat[0] : '-';

      if (primaryCatChartInstance) primaryCatChartInstance.destroy();
      const ctx1 = document.getElementById('primaryCategoryChart').getContext('2d');
      primaryCatChartInstance = new Chart(ctx1, {
        type: 'doughnut',
        data: {
          labels: Object.keys(primaryCatMap),
          datasets: [{
            data: Object.values(primaryCatMap),
            backgroundColor: Object.keys(primaryCatMap).map(cat => (categoryConfig[cat] || categoryConfig['其他類型']).color)
          }]
        },
        options: { responsive: true }
      });

      const tagMap = {};
      books.forEach(b => (b.tags || []).forEach(t => { tagMap[t] = (tagMap[t] || 0) + 1; }));
      const sortedTags = Object.entries(tagMap).sort((a, b) => b[1] - a[1]);

      const rankListEl = document.getElementById('tagsRankList');
      rankListEl.innerHTML = '';

      if (sortedTags.length === 0) {
        rankListEl.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">尚未新增任何書籍標籤</p>`;
      } else {
        sortedTags.forEach(([tag, count], index) => {
          rankListEl.innerHTML += `
            <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border border-slate-200 text-xs">
              <div class="flex items-center gap-2">
                <span class="w-5 h-5 rounded-full ${index === 0 ? 'bg-amber-400 text-white font-bold' : index === 1 ? 'bg-slate-300 text-slate-700' : index === 2 ? 'bg-amber-600/60 text-white' : 'bg-slate-100 text-slate-500'} flex items-center justify-center text-[10px] font-semibold">${index + 1}</span>
                <span class="font-medium text-slate-700">#${tag}</span>
              </div>
              <span class="font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">${count} 次</span>
            </div>
          `;
        });
      }

      const ratingMap = { '5.0⭐': 0, '4.0⭐': 0, '3.0⭐': 0, '2.0⭐': 0, '1.0⭐': 0 };
      books.forEach(b => {
        const r = Math.floor(parseFloat(b.rating || 5)) + '.0⭐';
        if (ratingMap[r] !== undefined) ratingMap[r]++;
      });

      if (ratingChartInstance) ratingChartInstance.destroy();
      const ctx3 = document.getElementById('ratingChart').getContext('2d');
      ratingChartInstance = new Chart(ctx3, {
        type: 'bar',
        data: {
          labels: Object.keys(ratingMap),
          datasets: [{ label: '本數', data: Object.values(ratingMap), backgroundColor: '#f59e0b', borderRadius: 4 }]
        },
        options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } } }
      });

      if (mediumChartInstance) mediumChartInstance.destroy();
      const ctx4 = document.getElementById('mediumChart').getContext('2d');
      mediumChartInstance = new Chart(ctx4, {
        type: 'pie',
        data: {
          labels: Object.keys(mediumMap),
          datasets: [{ data: Object.values(mediumMap), backgroundColor: ['#10b981', '#6366f1', '#64748b'] }]
        },
        options: { responsive: true }
      });
    }

    initCategorySelects();
    renderTags();
    loadBooksFromCloud();
  </script>
</body>
